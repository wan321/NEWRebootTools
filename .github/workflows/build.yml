
name: Build RebootTools Shortcuts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build TrollStore TIPA
    runs-on: macos-latest

    steps:
      # 1. 下载源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装构建工具
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install ldid make

      # 3. 配置 Theos
      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$GITHUB_WORKSPACE/theos"

          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          echo "Theos installed:"
          ls -la "$THEOS"

      # 4. 检查项目文件
      - name: Inspect project
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Project structure =========="
          find . -maxdepth 3 -type f | sort | head -300

          echo "========== Makefile =========="
          if [ -f Makefile ]; then
            cat Makefile
          else
            echo "ERROR: Makefile not found in repository root."
            exit 1
          fi

      # 5. 编译项目
      - name: Build project
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "========== Build =========="

          make clean || true

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless=0 \
            ARCHS=arm64

      # 6. 检查编译产物并生成 TIPA
      - name: Package TIPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          echo "========== Search build outputs =========="

          find . -type f \
            \( -name "*.deb" -o -name "*.ipa" -o -name "*.tipa" \) \
            ! -path "./dist/*" \
            ! -path "./.git/*" \
            -print

          PACKAGE=""

          while IFS= read -r file; do
            PACKAGE="$file"
            break
          done < <(
            find . -type f \
              \( -name "*.tipa" -o -name "*.ipa" \) \
              ! -path "./dist/*" \
              ! -path "./.git/*" \
              -print
          )

          if [ -n "$PACKAGE" ]; then
            cp "$PACKAGE" dist/RebootTools-Shortcuts.tipa

          else
            DEB=""

            while IFS= read -r file; do
              DEB="$file"
              break
            done < <(
              find . -type f -name "*.deb" \
                ! -path "./dist/*" \
                ! -path "./.git/*" \
                -print
            )

            if [ -z "$DEB" ]; then
              echo "ERROR: No IPA, TIPA or DEB generated."
              exit 1
            fi

            echo "Found DEB: $DEB"
            echo "A DEB is not a TrollStore TIPA."
            echo "The project needs an app bundle packaging step."
            exit 1
          fi

          echo "========== Final package =========="
          ls -lh dist/RebootTools-Shortcuts.tipa

      # 7. 验证 TIPA 内部结构
      - name: Verify TIPA
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="dist/RebootTools-Shortcuts.tipa"

          echo "========== Archive verification =========="

          unzip -t "$PACKAGE"

          echo "========== Contents =========="

          unzip -l "$PACKAGE"

          TMP="$(mktemp -d)"
          unzip -q "$PACKAGE" -d "$TMP"

          APP="$(find "$TMP/Payload" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APP" ]; then
            echo "ERROR: Payload/*.app not found."
            rm -rf "$TMP"
            exit 1
          fi

          echo "App bundle: $APP"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: Info.plist missing."
            rm -rf "$TMP"
            exit 1
          fi

          plutil -lint "$APP/Info.plist"

          echo "========== Executable =========="

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Info.plist")

          if [ ! -f "$APP/$EXECUTABLE" ]; then
            echo "ERROR: Main executable missing: $EXECUTABLE"
            rm -rf "$TMP"
            exit 1
          fi

          file "$APP/$EXECUTABLE"

          echo "========== Minimum iOS version =========="

          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$APP/Info.plist" || true

          echo "========== Bundle ID =========="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          rm -rf "$TMP"

          echo "TIPA structure verification passed."

      # 8. 上传最终 TIPA
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: RebootTools-Shortcuts-TIPA
          path: dist/RebootTools-Shortcuts.tipa
          if-no-files-found: error
          retention-days: 30
