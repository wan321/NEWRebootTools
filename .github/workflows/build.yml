
name: Build RebootTools Shortcuts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TrollStore TIPA
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 安装依赖
      - name: Install dependencies
        run: |
          set -euo pipefail
          brew install ldid dpkg xz

      # 3. 安装 Theos 和 iOS SDK
      - name: Install Theos
        run: |
          set -euo pipefail

          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/sdks"

          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"

          find "$RUNNER_TEMP/theos-sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -exec cp -R {} "$THEOS/sdks/" \;

          echo "Theos installed:"
          ls -lah "$THEOS"

          echo "Available SDKs:"
          ls -lah "$THEOS/sdks"

      # 4. 检查源码
      - name: Validate source
        run: |
          set -euo pipefail

          test -f Makefile
          test -f Resources/Info.plist

          plutil -lint Resources/Info.plist

          for helper in \
            Resources/RebootRootHelper \
            Resources/RebootUserSpaceHelper
          do
            if [ ! -s "$helper" ]; then
              echo "Missing helper: $helper"
              exit 1
            fi

            chmod +x "$helper"

            echo "Checking architecture: $helper"
            lipo "$helper" -verify_arch arm64

            echo "Helper OK: $helper"
          done

      # 5. 编译
      - name: Build package
        run: |
          set -euo pipefail

          make clean

          make package FINALPACKAGE=1

          echo "Build output:"
          find packages -maxdepth 2 -type f -print

      # 6. 生成固定名称 TIPA
      - name: Prepare TIPA
        run: |
          set -euo pipefail

          mkdir -p dist

          PACKAGE=""

          for file in packages/*.tipa packages/*.ipa; do
            if [ -f "$file" ]; then
              PACKAGE="$file"
              break
            fi
          done

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No IPA or TIPA package generated."
            exit 1
          fi

          cp "$PACKAGE" dist/RebootTools-Shortcuts.tipa

          echo "Final TIPA:"
          ls -lh dist/RebootTools-Shortcuts.tipa

      # 7. 验证 TIPA
      - name: Verify TIPA package
        run: |
          set -euo pipefail

          TIPA="dist/RebootTools-Shortcuts.tipa"
          TEMP_DIR="$(mktemp -d)"

          trap 'rm -rf "$TEMP_DIR"' EXIT

          test -s "$TIPA"

          unzip -q "$TIPA" -d "$TEMP_DIR"

          APP="$TEMP_DIR/Payload/RebootTools.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Payload/RebootTools.app not found."
            exit 1
          fi

          test -s "$APP/Info.plist"

          plutil -lint "$APP/Info.plist"

          for helper in \
            "$APP/RebootRootHelper" \
            "$APP/RebootUserSpaceHelper"
          do
            if [ ! -s "$helper" ]; then
              echo "ERROR: Missing helper: $helper"
              exit 1
            fi

            lipo "$helper" -verify_arch arm64

            if [ ! -x "$helper" ]; then
              echo "ERROR: Helper is not executable: $helper"
              exit 1
            fi
          done

          echo "TIPA structure verified successfully."

      # 8. 上传 TIPA
      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebootTools-Shortcuts-TIPA
          path: dist/RebootTools-Shortcuts.tipa
          if-no-files-found: error
          retention-days: 30
