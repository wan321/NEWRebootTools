
name: Build RebootTools Shortcuts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build TrollStore TIPA
    runs-on: macos-latest

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装依赖
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz

      # 3. 安装 Theos
      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      # 4. 检查项目结构
      - name: Check project
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f RebootRootHelper/Makefile
          test -d Resources

          echo "Project structure:"
          find . -maxdepth 2 -type f | sort

      # 5. 编译重启核心 Helper
      - name: Build RebootRootHelper
        shell: bash
        run: |
          set -euo pipefail

          make -C RebootRootHelper clean || true
          make -C RebootRootHelper FINALPACKAGE=1

          # 只接受真正的可执行 Mach-O：必须排除 .dSYM 里的 DWARF 调试符号文件。
          # 曾经因为 find 命中了 .theos/obj/arm64e/*.dSYM/Contents/Resources/DWARF/，
          # 把一个 MH_DSYM 文件当成 helper 打进 app，TrollStore 的 ldid 签名时报
          # Install Error 175（Failed to sign the app）。
          HELPER=""

          candidates=()
          if [ -f RebootRootHelper/.theos/obj/RebootRootHelper ]; then
            candidates+=("RebootRootHelper/.theos/obj/RebootRootHelper")
          fi
          while IFS= read -r file; do
            candidates+=("$file")
          done < <(
            find RebootRootHelper/.theos/obj \
              -type f \
              -name RebootRootHelper \
              -not -path '*.dSYM/*' \
              -print
          )

          # bash 3.2（macOS 默认）+ set -u 下，空数组展开 "${arr[@]}" 会报 unbound variable
          if (( ${#candidates[@]} == 0 )); then
            echo "ERROR: RebootRootHelper executable not found."
            find RebootRootHelper -type f -print
            exit 1
          fi

          for cand in "${candidates[@]}"; do
            desc="$(file -b "$cand")"
            echo "candidate: $cand -> $desc"
            case "$desc" in
              *Mach-O*executable*)
                HELPER="$cand"
                break
                ;;
            esac
          done

          if [ -z "$HELPER" ]; then
            echo "ERROR: RebootRootHelper executable not found."
            find RebootRootHelper -type f -print
            exit 1
          fi

          echo "Helper found: $HELPER"
          file "$HELPER"
          otool -hv "$HELPER"

          # 硬性闸门：必须是 EXECUTE，不能是 DSYM/OBJECT。
          if otool -hv "$HELPER" | grep -qiE 'DSYM|OBJECT'; then
            echo "ERROR: helper is not an executable Mach-O."
            exit 1
          fi

          mkdir -p Resources
          cp "$HELPER" Resources/RebootRootHelper

          chmod +x Resources/RebootRootHelper

          file Resources/RebootRootHelper

          # 打印并断言真正进包的 entitlements。helper 若缺 no-sandbox，
          # reboot(0) 会被沙箱拒绝；配合 helper 现在返回 errno，失败才可见。
          echo "========== HELPER ENTITLEMENTS =========="
          ldid -e Resources/RebootRootHelper
          for key in 'platform-application' 'com.apple.private.security.no-sandbox'; do
            if ! ldid -e Resources/RebootRootHelper | grep -q "$key"; then
              echo "ERROR: RebootRootHelper entitlements missing $key"
              exit 1
            fi
          done

      # 6. 编译主程序并生成 IPA
      - name: Build main application
        shell: bash
        run: |
          set -euo pipefail

          make clean || true

          make package \
            FINALPACKAGE=1 \
            PACKAGE_FORMAT=ipa

          echo "Build completed."

      # 7. 收集 TIPA
      - name: Collect TIPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          PACKAGE=""

          while IFS= read -r file; do
            PACKAGE="$file"
            break
          done < <(
            find packages -maxdepth 1 -type f \
              \( -name "*.tipa" -o -name "*.ipa" \) \
              -print 2>/dev/null
          )

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No IPA or TIPA generated."
            echo "Available files:"
            find . -maxdepth 5 -type f \
              \( -name "*.ipa" -o -name "*.tipa" \) \
              -print
            exit 1
          fi

          cp "$PACKAGE" dist/RebootTools-Shortcuts.tipa

          echo "Final package:"
          ls -lh dist/RebootTools-Shortcuts.tipa

      # 8. 检查安装包
      - name: Verify TIPA
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="dist/RebootTools-Shortcuts.tipa"
          TMP="$(mktemp -d)"

          unzip -t "$PACKAGE"
          unzip -q "$PACKAGE" -d "$TMP"

          APP="$(find "$TMP/Payload" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Payload/*.app missing."
            exit 1
          fi

          test -f "$APP/Info.plist"

          plutil -lint "$APP/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Info.plist")

          test -f "$APP/$EXECUTABLE"

          echo "========== APP INFORMATION =========="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$APP/Info.plist" || true

          echo "========== EXECUTABLE =========="

          file "$APP/$EXECUTABLE"

          echo "========== HELPER =========="

          if [ -f "$APP/RebootRootHelper" ]; then
            file "$APP/RebootRootHelper"
            otool -hv "$APP/RebootRootHelper"
            echo "========== PACKAGED HELPER ENTITLEMENTS =========="
            ldid -e "$APP/RebootRootHelper"
            if ! ldid -e "$APP/RebootRootHelper" | grep -q 'com.apple.private.security.no-sandbox'; then
              echo "ERROR: packaged RebootRootHelper lost no-sandbox entitlement."
              exit 1
            fi
            if otool -hv "$APP/RebootRootHelper" | grep -qiE 'DSYM|OBJECT'; then
              echo "ERROR: bundled RebootRootHelper is a debug-symbol file, not an executable."
              exit 1
            fi
          else
            echo "WARNING: RebootRootHelper not found inside app."
          fi

          rm -rf "$TMP"

          echo "TIPA verification completed."

      # 9. 上传 GitHub 构建产物
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: RebootTools-Shortcuts-TIPA
          path: dist/RebootTools-Shortcuts.tipa
          if-no-files-found: error
          retention-days: 30
